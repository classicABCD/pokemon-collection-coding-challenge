spring:
  application:
    name: pokemon-collection
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokemon}
    username: ${DB_USERNAME:pokemon}
    password: ${DB_PASSWORD:pokemon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  identity:
    # Ends every session after this time, even an active one (the servlet session timeout above only covers idleness)
    session-absolute-timeout: 8h
  catalog:
    sync:
      base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
      cron: "0 0 3 * * *"
      # Load the catalog on startup; while it is still empty (e.g. PokéAPI unreachable) retry after this delay
      initial-sync: true
      initial-sync-retry-delay: 1m
      max-deprecation-ratio: 0.1
      max-concurrent-requests: 10
