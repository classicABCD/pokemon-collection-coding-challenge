server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers (Mantine sets inline styles, sprites come from GitHub)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://raw.githubusercontent.com; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # API on the same origin: session and XSRF cookies work without CORS (ADR-2).
    # Only /api is proxied, the actuator endpoints stay internal.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Set once by nginx for all responses
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # Hashed file names: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routing
    location / {
        try_files $uri /index.html;
    }
}
