openapi: 3.0.3
info:
  title: Pokémon Collection API
  version: 1.0.0
  description: |
    The contract between frontend and backend.
servers:
  - url: /
tags:
  - name: auth
    description: Registration, login and session
  - name: catalog
    description: Local Pokémon catalog
  - name: collection
    description: Collection of the logged-in trainer

security:
  - sessionCookie: []

paths:
  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new trainer and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Trainer created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trainer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Username already taken
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trainer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      # 401/403 are written as problem details by the security filter chain, before the controller is reached.
      # No content type is declared here: otherwise the generated mapping would only produce application/problem+json
      # and reject clients sending "Accept: application/json" with 406.
      responses:
        '204':
          description: Logged out
        '401':
          description: Not authenticated (problem details)
        '403':
          description: Missing or invalid CSRF token (problem details)

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentTrainer
      summary: Get the logged-in trainer
      security: []
      responses:
        '200':
          description: Current trainer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trainer'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/pokemon:
    get:
      tags: [catalog]
      operationId: listPokemon
      summary: List all Pokémon, including deprecated ones
      description: |
        Returns the complete catalog. Deprecated Pokémon are included and flagged with `deprecated = true`;
        they cannot be added to a collection. Filtering and sorting happen in the frontend.
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pokemon'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/pokemon/sync-status:
    get:
      tags: [catalog]
      operationId: getCatalogSyncStatus
      summary: Get the state of the catalog sync with PokéAPI
      description: |
        Lets the frontend explain an empty catalog: the initial sync is still running, or PokéAPI is unreachable and
        the sync is retried automatically.
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSyncStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/collection:
    get:
      tags: [collection]
      operationId: listCollection
      summary: List the collection of the logged-in trainer
      description: Includes deprecated Pokémon (flagged with `deprecated = true`).
      responses:
        '200':
          description: Collection entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [collection]
      operationId: addToCollection
      summary: Add a Pokémon to the collection of the logged-in trainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCollectionRequest'
      responses:
        '201':
          description: Pokémon added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Pokémon is already in the collection
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Pokémon is unknown or deprecated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Not authenticated or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Missing or invalid CSRF token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z0-9_]+$'
          example: ash_ketchum
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Max. 72 characters and 72 bytes in UTF-8 (BCrypt limit)

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: ash_ketchum
        password:
          type: string
          format: password

    Trainer:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: ash_ketchum

    Pokemon:
      type: object
      required: [id, name, types, deprecated]
      properties:
        id:
          type: integer
          format: int32
          description: PokéAPI id (National Pokédex number)
          example: 25
        name:
          type: string
          example: pikachu
        types:
          type: array
          description: One or two type names, in slot order
          items:
            type: string
          example: [electric]
        spriteUrl:
          type: string
          nullable: true
          example: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png
        deprecated:
          type: boolean
          description: True if the Pokémon no longer exists in PokéAPI

    CatalogSyncStatus:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/CatalogSyncState'

    CatalogSyncState:
      type: string
      enum: [idle, running, failed]
      description: |
        `running`: a sync is in progress. `failed`: the last sync could not load any Pokémon (e.g. PokéAPI
        unreachable); while the catalog is empty it is retried automatically. `idle`: no sync running, last one fine.

    CollectionEntry:
      type: object
      required: [pokemon, addedAt]
      properties:
        pokemon:
          $ref: '#/components/schemas/Pokemon'
        addedAt:
          type: string
          format: date-time

    AddToCollectionRequest:
      type: object
      required: [pokemonId]
      properties:
        pokemonId:
          type: integer
          format: int32
          minimum: 1
          example: 25

    ProblemDetail:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          format: int32
          example: 409
        detail:
          type: string
          example: Pokémon 25 is already in your collection
        instance:
          type: string
          example: /api/collection
